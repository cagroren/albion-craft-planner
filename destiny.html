<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Albion Destiny Board</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#0b0f14"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<style>
:root{--bg:#0b0f14;--card:#11161d;--card2:#151b23;--in:#0d1218;--ink:#e6e9ee;--mut:#8b95a3;--line:#252d38;--line2:#323c49;--acc:#f0883e;--acc2:#7a3e16;--accT:#ffd6b3;--good:#3fb950;--bad:#f85149;--warn:#e3b341;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px;-webkit-font-smoothing:antialiased}
main{max-width:1180px;margin:auto}
h1{font:800 30px/1.2 "Inter",system-ui,sans-serif;letter-spacing:-.01em;margin:0}
h2{font:700 12px/1.4 "Inter",system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin:0 0 14px}
h3{font:800 22px/1.25 "Inter",sans-serif;margin:0}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
button,select,input{font:inherit;padding:9px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--in);color:var(--ink);min-width:0}
input::placeholder{color:#5f6976}
button{background:var(--acc2);color:var(--accT);border-color:#b8602a;cursor:pointer;font-weight:700;transition:background .15s,border-color .15s,color .15s}
button:hover{background:#8f4a1b;border-color:var(--acc)}
button.l{background:transparent;color:var(--acc);border-color:#5a3a24}
button.l:hover{background:rgba(240,136,62,.08);border-color:var(--acc)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
img[src*="render.albiononline.com"]{filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.topbar{margin:0;align-items:center;gap:10px}
.tabs{display:flex;gap:4px;margin:0;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;width:fit-content;max-width:100%;overflow-x:auto;flex-wrap:nowrap}
.tabs button{flex:none;background:transparent;border-color:transparent;color:var(--mut);white-space:nowrap;padding:8px 14px}
.tabs button:hover{color:var(--ink);background:var(--card2);border-color:transparent}
.tabs button.on{background:var(--acc2);color:var(--accT);border-color:#b8602a}
.st{color:var(--mut);font-size:13px}
.note{border:1px solid rgba(227,179,65,.45);background:rgba(227,179,65,.06);border-radius:12px;padding:10px 14px;margin:0 0 16px;font-size:14px}
.lay{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:16px;align-items:start}
.tree{max-height:72vh;overflow-y:auto;margin-top:12px;padding-right:4px}
.grp{margin-bottom:10px}
.grp>summary{cursor:pointer;font-weight:800;font-size:14px;padding:6px 4px;list-style:none;display:flex;align-items:center;gap:8px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"▸";color:var(--acc);font-size:11px}
.grp[open]>summary::before{content:"▾"}
.grp>summary small{color:var(--mut);font-weight:600;margin-left:auto}
.nd{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:5px 8px;color:var(--ink);font-weight:500;font-size:14px}
.nd:hover{background:var(--card2);border-color:var(--line)}
.nd.on{background:rgba(240,136,62,.1);border-color:#b8602a}
.nd img,.nd .ph{width:34px;height:34px;flex:none}
.nd .ph{border-radius:8px;background:var(--in)}
.nd span{flex:1;min-width:0;overflow-wrap:anywhere}
.nd b{font-size:12px;color:var(--accT);font-weight:800}
.nd.ms span{font-weight:800}
.hd{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.hd img{width:64px;height:64px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.g label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.g label input,.g label select{text-transform:none;letter-spacing:0;font-weight:500;font-size:15px;color:var(--ink)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}
.k{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--mut);min-width:0}
.k b{display:block;font-size:22px;font-weight:800;color:var(--ink);margin-top:2px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.k.big{border-color:#b8602a;background:linear-gradient(135deg,rgba(240,136,62,.14),rgba(240,136,62,.02) 70%),var(--card2)}
.k.big b{color:var(--acc)}
.bon{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.bon div{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.bon b{color:var(--good)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:5px 11px;font-size:13px;background:var(--in);color:var(--mut);border-color:var(--line2);font-weight:600}
.chips button.on{background:var(--acc2);color:var(--accT);border-color:#b8602a}
.empty{color:var(--mut);padding:30px 10px;text-align:center}
@media(max-width:860px){.lay{grid-template-columns:1fr}.tree{max-height:46vh}}
@media(max-width:700px){body{padding:12px 16px}section{padding:16px;border-radius:14px}.tabs button{padding:8px 11px}h1{font-size:24px}}
</style>
</head>
<body>
<main>
<div class="row topbar"><div class="tabs"><button data-go="./">Alchemy</button><button data-go="./#food">Cooking</button><button data-go="./#craft">Craft</button><button data-go="./#farm">Farming</button><button data-go="./#refine">Refining</button><button data-go="./#bm">Black Market Flips</button><button data-go="./#enchant">Enchant Yükseltme</button><button data-go="./#db">Item Database</button><button data-go="builds.html">Builds</button><button class="on" aria-current="page">Destiny Board</button><button data-go="dps.html">DPS Meter</button></div></div>
<div style="display:flex;align-items:center;gap:12px;margin:14px 0 16px"><img src="logo.png" alt="KVF" width="48" height="48"><h1>Destiny Board</h1></div>
<div class="note">Seviyelerin oyundan otomatik okunması test aşamasında (DPS Meter v6 kayıt modu). Şimdilik bir spec seçip <b>şu anki seviyeni</b> kendin gir; girdiğin seviyeler bu tarayıcıda hatırlanır.</div>
<div class="lay">
<section><h2>Board</h2>
<div class="chips" id="cats"></div>
<input id="q" type="search" placeholder="Spec ara (örn. Claymore, Ore, Carrot)" aria-label="Spec ara" style="width:100%;margin-top:12px">
<div class="tree" id="tree"><div class="empty">Yükleniyor...</div></div></section>
<section id="calc"><div class="empty">Soldan bir spec seç.</div></section>
</div>
</main>
<script>
(function(){
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?"":t).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const fmt=n=>Math.round(n).toLocaleString("tr-TR");
const dec=(n,d)=>(+n).toLocaleString("tr-TR",{maximumFractionDigits:d==null?2:d});
const LS=(()=>{try{return JSON.parse(localStorage.getItem("aodestiny1")||"{}")}catch(e){return {}}})();
LS.lv=LS.lv||{};
const saveLS=()=>{try{localStorage.setItem("aodestiny1",JSON.stringify(LS))}catch(e){}};
const icon=id=>id?`<img loading="lazy" src="https://render.albiononline.com/v1/item/${encodeURIComponent(id)}.png?size=64" alt="" onerror="this.style.visibility='hidden'">`:'<span class="ph"></span>';
const CATS=[["fighting","Combat"],["crafting","Crafting ve Refining"],["gathering","Gathering"],["farming","Farming, Cooking, Alchemy"],["tracking","Tracking"]];
let D=null,cat=LS.cat||"fighting",sel=LS.sel||null;

// ---------- seviye hesapları (oyunun seviye tabloları × düğümün çarpanı)
const tpl=n=>D.templates[n.tpl]||{lv:[],el:[]};
const maxLv=n=>tpl(n).lv.length+tpl(n).el.length;
function between(n,from,to){
  const T=tpl(n),r={fame:0,lp:0,efame:0,silver:0};
  for(let i=from+1;i<=to;i++){
    if(i<=T.lv.length){const [f,l]=T.lv[i-1];r.fame+=f*n.fm;r.lp+=l*n.lm}
    else{const e=T.el[i-T.lv.length-1];if(!e)break;r.efame+=e[0]*n.fm;r.silver+=e[0]*n.fm*e[1]}
  }
  return r;
}
// Bonus metni: oyundaki "{0} Bonus to ..." kalıbına seviye farkı × seviye başı değer konur
function bonusLines(n,from,to){
  const T=tpl(n),B=T.lv.length,acc=new Map();
  // Normal ve elite seviyelerdeki aynı bonus tek satırda toplanır
  const add=(list,levels)=>(list||[]).forEach(b=>{if(!levels||b.b==null)return;const k=[b.d||b.type,b.type,b.buff,b.min,b.max].join("|"),o=acc.get(k)||{b,v:0};o.v+=b.b*levels;acc.set(k,o)});
  add(n.bon,Math.max(0,Math.min(to,B)-Math.min(from,B)));
  add(n.ebon,Math.max(0,Math.max(to,B)-Math.max(from,B)));
  return [...acc.values()].map(({b,v})=>{const pc=b.type==="resourcegatherbonus";
    return (b.d||b.type).replace("{0}",`<b>+${pc?"%"+dec(v*100,1):dec(v,1)}</b>`)+(b.min!=null&&b.max!=null&&b.min!==b.max?` <small class="st">(T${b.min}-T${b.max})</small>`:b.min!=null?` <small class="st">(T${b.min})</small>`:"")});
}

// ---------- ağaç
function groups(){
  const L=Object.entries(D.nodes).filter(([,n])=>n.cat===cat&&n.tpl);
  const G={};
  L.forEach(([id,n])=>{const k=n.sub||"Diğer";(G[k]=G[k]||[]).push([id,n])});
  return Object.entries(G).map(([k,l])=>[k,l.sort((a,b)=>(tpl(b[1]).spec?0:1)-(tpl(a[1]).spec?0:1)||(a[1].ring||0)-(b[1].ring||0)||a[1].t.localeCompare(b[1].t))]).sort((a,b)=>a[0].localeCompare(b[0]));
}
function drawTree(){
  $("cats").innerHTML=CATS.map(([k,l])=>`<button data-c="${k}" class="${k===cat?"on":""}">${l}</button>`).join("");
  $("cats").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cat=LS.cat=b.dataset.c;saveLS();drawTree()});
  const q=$("q").value.trim().toLowerCase();
  const G=groups().map(([k,l])=>[k,l.filter(([id,n])=>!q||(n.t+" "+k).toLowerCase().includes(q))]).filter(([,l])=>l.length);
  $("tree").innerHTML=G.map(([k,l])=>`<details class="grp"${q||l.some(([id])=>id===sel)?" open":""}><summary>${esc(k)}<small>${l.length}</small></summary>${l.map(([id,n])=>{const lv=LS.lv[id];return `<button type="button" class="nd${id===sel?" on":""}${tpl(n).spec?"":" ms"}" data-n="${id}">${icon(n.icon)}<span>${esc(n.t)}</span>${lv?`<b>${lv}</b>`:""}</button>`}).join("")}</details>`).join("")||'<div class="empty">Sonuç yok.</div>';
  $("tree").querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{sel=LS.sel=b.dataset.n;saveLS();drawTree();drawCalc()});
}

// ---------- hesaplayıcı
function drawCalc(){
  const n=sel&&D.nodes[sel];if(!n||!n.tpl){$("calc").innerHTML='<div class="empty">Soldan bir spec seç.</div>';return}
  const M=maxLv(n),B=tpl(n).lv.length,cur=Math.min(M,LS.lv[sel]||0),tgt=Math.min(M,Math.max(cur+1,+(LS.tg&&LS.tg[sel])||Math.min(M,Math.max(B,cur+1))));
  const parent=(n.p||[]).map(p=>D.nodes[p]&&D.nodes[p].t).filter(Boolean).join(", ");
  $("calc").innerHTML=`<div class="hd">${icon(n.icon)}<div><h3>${esc(n.t)}</h3><div class="st">${esc(n.sub||"")}${parent?" · üst: "+esc(parent):""} · en yüksek seviye ${M}${n.rs==="combat"?" · combat fame credit ile respec edilebilir":""}</div></div></div>
  <div class="g"><label>Şu anki seviye<input type="number" id="cLv" min="0" max="${M}" value="${cur}"></label>
  <label>Hedef seviye<input type="number" id="cTg" min="1" max="${M}" value="${tgt}"></label>
  <label>Bu seviyede kazandığın fame<input type="number" id="cIn" min="0" value="${LS.inl&&LS.inl[sel]||""}" placeholder="0"></label>
  <label>Saatte kazandığın fame<input type="number" id="cFph" min="0" value="${LS.fph||""}" placeholder="örn. 1500000"></label></div>
  <div class="row" style="margin-top:10px">${[B<M?[B,"100'e"]:null,M>B?[M,M+"'ye"]:null].filter(Boolean).map(([v,l])=>`<button type="button" class="l" data-t="${v}" style="padding:5px 11px;font-size:13px">${l} kadar</button>`).join("")}</div>
  <div id="cOut"></div>`;
  const out=()=>{
    const c=Math.max(0,Math.min(M,+$("cLv").value||0)),t=Math.max(0,Math.min(M,+$("cTg").value||0)),inl=Math.max(0,+$("cIn").value||0),fph=Math.max(0,+$("cFph").value||0);
    LS.lv[sel]=c;LS.tg=LS.tg||{};LS.tg[sel]=t;LS.inl=LS.inl||{};LS.inl[sel]=inl||undefined;LS.fph=fph||undefined;saveLS();
    const tb=$("tree").querySelector(`[data-n="${sel}"] b`);
    if(t<=c){$("cOut").innerHTML='<div class="empty" style="padding:18px">Hedef seviye şu anki seviyeden yüksek olmalı.</div>';return}
    const r=between(n,c,t),all=r.fame+r.efame,need=Math.max(0,all-inl),lpPerDay=D.lp.secPerPointPremium?86400/D.lp.secPerPointPremium:30;
    const lines=bonusLines(n,c,t);
    $("cOut").innerHTML=`<div class="kp">
      <div class="k big">${c} → ${t} için gereken fame<b>${fmt(need)}</b>${inl?`<small>bu seviyede kazandığın ${fmt(inl)} düşüldü</small>`:""}</div>
      ${r.fame?`<div class="k">1-100 arası<b>${fmt(Math.max(0,r.fame-inl))}</b><small>normal seviyeler</small></div>`:""}
      ${r.efame?`<div class="k">Elite (100 üstü)<b>${fmt(r.efame)}</b><small>${t-Math.max(c,B)} elite seviye</small></div>`:""}
      ${r.silver?`<div class="k">Credit ile respec yaparsan<b>${fmt(r.silver)} silver</b><small>elite fame × oyunun respec oranı; ${fmt(r.efame)} combat fame credit gerekir</small></div>`:""}
      ${r.lp?`<div class="k">Learning Points ile<b>${fmt(r.lp)} LP</b><small>Premium'la günde ${dec(lpPerDay,0)} LP · ${dec(r.lp/lpPerDay,1)} gün</small></div>`:""}
      ${fph?`<div class="k">Tahmini süre<b>${dec(need/fph,1)} saat</b><small>saatte ${fmt(fph)} fame ile</small></div>`:""}
    </div>
    ${lines.length?`<h2 style="margin-top:20px">${t} seviyede kazanacağın</h2><div class="bon">${lines.map(l=>`<div>${l}</div>`).join("")}</div>`:""}
    ${n.rs==="combat"&&r.fame?`<p class="st" style="margin-top:12px">100'ün altındaki seviyeleri credit ile respec etmenin silver bedeli oyun verisinde yok; oyundaki respec penceresinde görünür.</p>`:""}`;
    if(tb)tb.textContent=c||"";else if(c)drawTree();
  };
  ["cLv","cTg","cIn","cFph"].forEach(i=>$(i).addEventListener("input",out));
  $("calc").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{$("cTg").value=b.dataset.t;out()});
  out();
}

document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{location.href=b.dataset.go});
$("q").addEventListener("input",drawTree);
fetch("data/destiny.json").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(j=>{D=j;drawTree();drawCalc()})
  .catch(e=>{$("tree").innerHTML=`<div class="empty">Board verisi yüklenemedi (${esc(e.message)}). Sayfayı yenile.</div>`});
})();
</script>
</body>
</html>
